services:
  postgres:
    image: postgres:16-alpine
    container_name: snake_game_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snake_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snake_password}
      POSTGRES_DB: ${POSTGRES_DB:-snake_game_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - snake_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-snake_user} -d $${POSTGRES_DB:-snake_game_db}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snake_game_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3010
      DATABASE_URL: postgresql://${POSTGRES_USER:-snake_user}:${POSTGRES_PASSWORD:-snake_password}@postgres:5432/${POSTGRES_DB:-snake_game_db}?schema=public
      CORS_ORIGIN: '*'
    ports:
      - '3010:3010'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: snake_game_frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  snake_postgres_data:
